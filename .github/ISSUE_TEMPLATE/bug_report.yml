name: Bug report
description: Report a reproducible problem with Claudex.
body:
  - type: markdown
    attributes:
      value: |
        Use this form for bugs, not security vulnerabilities. Report security issues through private vulnerability reporting, as described in SECURITY.md.

        Never include tokens, auth files, authorization headers, private prompts, or real tool output. Replace private content with a small synthetic example. Review diagnostic output before posting it.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what should have happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command and the smallest safe input that reproduces the problem. State whether it uses a native Claude model or a codex/ model.
      placeholder: |
        1. Start Claudex with ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the OS, architecture, installation method, and versions. Bun is only needed for source builds.
      placeholder: |
        OS and architecture:
        Installation method: source build / release binary
        claudex --version:
        claude --version:
        codex --version:
        bun --version (source builds only):
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized error output
      description: Include only relevant error text. Do not attach credential stores or full request captures. Remove account details and private paths.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: This report contains no credentials or private request content.
          required: true
