name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, matching package.json (vX.Y.Z)
        required: true
        type: string
      publish:
        description: Publish the release after all builds pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Validate version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bun -e 'import metadata from "./package.json"; if (process.env.RELEASE_TAG !== `v${metadata.version}`) throw new Error("Tag must match package.json");'
      - run: bun install --frozen-lockfile
      - name: Install pinned AOT compiler
        run: |
          sh scripts/setup-bun.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bun check
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun test --reporter=dot
      - run: bun run build
      - name: Smoke test the executable
        run: |
          test "$(./dist/claudex --version)" = "$(bun -p 'require("./package.json").version')"
          ./dist/claudex --help
      - name: Package executable
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p release
          tar -czf "release/claudex-$PLATFORM.tar.gz" LICENSE -C dist claudex
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claudex-${{ matrix.platform }}
          path: release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  package:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: claudex-*
          merge-multiple: true
          path: release
      - name: Check complete build set and write checksums
        working-directory: release
        run: |
          test "$(ls claudex-*.tar.gz | wc -l)" -eq 4
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            test -s "claudex-$platform.tar.gz"
          done
          sha256sum claudex-*.tar.gz > SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: inputs.publish
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Publish verified release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --title "$RELEASE_TAG"
